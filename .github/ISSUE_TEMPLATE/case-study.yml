name: 📘 分享实践案例
description: 提交可验证、隐私安全的实践记录
title: "[案例] "
labels: [case-study]
body:
  - type: markdown
    attributes:
      value: "请保护隐私；避免在公开仓库贴手机号、简历或支付记录原图。"
  - type: textarea
    id: context
    attributes:
      label: 用户场景与问题
      description: 描述具体场景，避免身份信息
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: 试验与投入
      description: 步骤、时间、预算、退出条件
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 实际结果和证据等级
      description: 事实/推断/未核验，公开证据链接（如可披露）
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与许可确认
      options:
        - label: 我有权分享这些内容，并已去除可识别的私人数据
          required: true
